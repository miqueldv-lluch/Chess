<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess Report</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2d2a26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #faf7f2; color: #2d2a26;
    margin: 0; padding: 20px 16px 40px;
    max-width: 480px; margin-inline: auto;
  }
  h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 24px; margin-bottom: 4px; }
  .sub { color: #8a8478; font-size: 13px; margin-bottom: 20px; }
  .card {
    background: #fff; border: 1px solid #e5ddd0; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 12px; display: block;
    text-decoration: none; color: inherit;
  }
  .card:active { background: #f0e9de; }
  .card .date { font-weight: 600; font-size: 15px; }
  .card .stats { font-size: 13px; color: #666; margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .badge.acc { background: #e6f0e9; color: #2f855a; }
  .badge.blun { background: #fbe9e9; color: #c53030; }
  #empty { color: #8a8478; padding: 40px 0; text-align: center; }
  #refresh {
    position: fixed; bottom: 20px; right: 20px;
    background: #2d2a26; color: #fff; border: none; border-radius: 50%;
    width: 48px; height: 48px; font-size: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  .run-link {
    display: block; text-align: center; background: #2f855a; color: #fff;
    text-decoration: none; padding: 12px 16px; border-radius: 10px;
    font-weight: 600; font-size: 14px; margin-bottom: 20px;
  }
  .run-link:active { background: #276749; }
</style>
</head>
<body>
<h1>Informes d'escacs</h1>
<div class="sub" id="subtitle">Carregant...</div>
<a class="run-link" href="https://github.com/miqueldv-lluch/Chess/actions/workflows/weekly-chess-report.yml" target="_blank" rel="noopener">
  ▶️ Generar informe ara (obre GitHub Actions)
</a>
<div id="list"></div>
<div id="empty" style="display:none">Encara no hi ha informes generats.</div>
<button id="refresh" onclick="load()">⟳</button>

<script>
async function load() {
  document.getElementById('subtitle').textContent = 'Carregant...';
  try {
    const res = await fetch('reports_index.json?_=' + Date.now());
    const data = await res.json();
    const list = document.getElementById('list');
    list.innerHTML = '';
    if (!data.length) {
      document.getElementById('empty').style.display = 'block';
      document.getElementById('subtitle').textContent = '';
      return;
    }
    document.getElementById('empty').style.display = 'none';
    document.getElementById('subtitle').textContent = `${data.length} informes`;
    data.forEach(r => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = 'reports/' + r.file.split('/').pop();
      a.innerHTML = `
        <div class="date">${r.date}</div>
        <div class="stats">
          <span class="badge acc">${r.avg_accuracy}% accuracy</span>
          <span class="badge blun">${r.total_blunders} blunders</span>
          <span>${r.win}-${r.loss}-${r.draw}</span>
        </div>`;
      list.appendChild(a);
    });
  } catch (e) {
    document.getElementById('subtitle').textContent = 'Error carregant informes';
  }
}
load();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
